ator-agent\",env=~\"$env\"}[10m]))","series_name_format":"{{ source }} p{{ quantile }}"}}}}]}},"engineCost":{"kind":"Panel","spec":{"display":{"description":"Model cost of runs finished in the trailing hour.","name":"Engine cost per hour by source (USD)"},"formulas":[],"links":[],"plugin":{"kind":"TimeSeriesChart","spec":{"legend":{"mode":"List","position":"Bottom","values":[]},"tooltip":{"mode":"nearby"},"visual":{"area_opacity":0.3,"line_width":1.5,"point_radius":3,"stack":"All"},"y_axis":{"min":0,"unit":{"abbreviate":false,"decimal_places":2,"kind":"Decimal"}}}},"queries":[{"kind":"DataQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"query":"sum by (source) (sum_over_time(engine_run_cost_usd{job=\"investigator-agent\",env=~\"$env\"}[1h]))","series_name_format":"{{ source }}"}}}}]}},"agentRuns":{"kind":"Panel","spec":{"display":{"description":"Runs finished in the trailing hour, from the agents app''s 10 minute silent tick.","name":"Agent runs per hour by agent and status"},"formulas":[],"links":[],"plugin":{"kind":"TimeSeriesChart","spec":{"legend":{"mode":"List","position":"Bottom","values":[]},"tooltip":{"mode":"nearby"},"visual":{"area_opacity":0.3,"line_width":1.5,"point_radius":3,"stack":"All"},"y_axis":{"min":0,"unit":{"abbreviate":true,"decimal_places":0,"kind":"Decimal"}}}},"queries":[{"kind":"DataQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"query":"sum by (agent, status) (sum_over_time(agent_runs{job=\"ai-agents\",env=~\"$env\"}[1h]))","series_name_format":"{{ agent }} {{ status }}"}}}}]}},"agentFailed":{"kind":"Panel","spec":{"display":{"description":"Monitor: >= 3 in 1h.","name":"Agent failed runs per hour"},"formulas":[],"links":[],"plugin":{"kind":"TimeSeriesChart","spec":{"legend":{"mode":"List","position":"Bottom","values":[]},"tooltip":{"mode":"nearby"},"visual":{"area_opacity":0.3,"line_width":1.5,"point_radius":3},"y_axis":{"min":0,"unit":{"abbreviate":true,"decimal_places":0,"kind":"Decimal"}}}},"queries":[{"kind":"DataQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"query":"sum by (agent) (sum_over_time(agent_runs{job=\"ai-agents\",env=~\"$env\",status=\"failed\"}[1h]))","series_name_format":"{{ agent }}"}}}},{"kind":"DataQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"query":"vector(3)","series_name_format":"alert line"}}}}]}},"tickAge":{"kind":"Panel","spec":{"display":{"description":"Seconds since each agent''s dispatcher last ticked, read at push time. Monitor: > 600.","name":"Agent dispatcher tick age"},"formulas":[],"links":[],"plugin":{"kind":"TimeSeriesChart","spec":{"legend":{"mode":"List","position":"Bottom","values":[]},"tooltip":{"mode":"nearby"},"visual":{"area_opacity":0.3,"line_width":1.5,"point_radius":3},"y_axis":{"min":0,"unit":{"kind":"Seconds"}}}},"queries":[{"kind":"DataQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"query":"max by (agent) (max_over_time(agent_dispatcher_tick_age_s{job=\"ai-agents\",env=~\"$env\"}[20m]))","series_name_format":"{{ agent }}"}}}},{"kind":"DataQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"query":"vector(600)","series_name_format":"alert line"}}}}]}},"agentDuration":{"kind":"Panel","spec":{"display":{"description":"p50 and p95 of duration_ms per 10 minute window.","name":"Agent run duration"},"formulas":[],"links":[],"plugin":{"kind":"TimeSeriesChart","spec":{"legend":{"mode":"List","position":"Bottom","values":[]},"tooltip":{"mode":"nearby"},"visual":{"area_opacity":0.3,"line_width":1.5,"point_radius":3},"y_axis":{"min":0,"unit":{"kind":"Milliseconds"}}}},"queries":[{"kind":"DataQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"query":"max by (agent, quantile) (max_over_time(agent_run_duration_ms{job=\"ai-agents\",env=~\"$env\"}[20m]))","series_name_format":"{{ agent }} p{{ quantile }}"}}}}]}},"agentCost":{"kind":"Panel","spec":{"display":{"description":"Cost of agent runs finished in the trailing hour.","name":"Agent cost per hour (USD)"},"formulas":[],"links":[],"plugin":{"kind":"TimeSeriesChart","spec":{"legend":{"mode":"List","position":"Bottom","values":[]},"tooltip":{"mode":"nearby"},"visual":{"area_opacity":0.3,"line_width":1.5,"point_radius":3,"stack":"All"},"y_axis":{"min":0,"unit":{"abbreviate":false,"decimal_places":2,"kind":"Decimal"}}}},"queries":[{"kind":"DataQuery","spec":{"plugin":{"kind":"PrometheusTimeSeriesQuery","spec":{"query":"sum by (agent) (sum_over_time(agent_run_cost_usd{job=\"ai-agents\",env=~\"$env\"}[1h]))","series_name_format":"{{ agent }}"}}}}]}}},"variables":[{"kind":"ListVariable","spec":{"allow_all_value":true,"allow_multiple":true,"custom_all_value":".*","default_value":["prod"],"display":{"name":"env"},"name":"env","plugin":{"kind":"StaticListVariable","spec":{"values":[{"label":"prod","value":"prod"},{"label":"stage","value":"stage"}]}},"refresh":"DashboardLoad"}}]},"spec_version":"1"}'
